<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ThunderStudy</title>

  <!-- 1. Canonical Tag: Tells Google the new domain is the primary source -->
  <link rel="canonical" href="https://indevs.in" />

  <!-- 2. Meta Refresh: Instant fallback redirect for crawlers -->
  <meta http-equiv="refresh" content="0;url=https://indevs.in">

  <!-- 3. JavaScript Redirect: Preserves sub-pages and deep links -->
  <script type="text/javascript">
    var oldDomain = "thunderstudy.github.io";
    if (window.location.hostname === oldDomain) {
      window.location.replace("https://thunderstudy.indevs.in" + window.location.pathname + window.location.search);
    }
  </script>
</head>
<body>
  <p>Redirecting you to ThunderStudy... If you are not redirected automatically, <a href="https://thunderstudy.indevs.in">click here</a>.</p>
</body>
</html>
